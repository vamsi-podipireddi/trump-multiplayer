# Cloudflare Worker config — single-Worker deploy:
# serves the static client (./app) AND the realtime backend (Durable Objects),
# all on one origin. `npm run deploy`.
name = "trump-multiplayer"
main = "src/worker/index.js"
compatibility_date = "2025-09-01"

# Runaway guard, not a budget. The platform meters CPU per *invocation*, and the
# DO's unit of work is one invocation per event: WebSocket hibernation
# (ctx.acceptWebSocket in src/worker/room-do.js) makes every inbound message its
# own invocation rather than accumulating across a connection, and each alarm
# fires exactly one bot action (src/core/room/timers.js -> drive.js's aiAct).
# Measured with `node scripts/bench-auction-search.js cost`, all four seats on
# "hard": p95 ~2 ms an invocation, worst single decision 3.9-8.1 ms across runs
# (one 18.6 ms outlier attributable to GC, not to search width). 300 ms is ~15x
# that worst case — wide enough that a legitimate alarm can never be killed, since
# a killed alarm stalls a live game — and 100x below the Paid plan's 30 s default,
# which the docs recommend lowering explicitly to bound a denial-of-wallet or a
# runaway loop. Raise it only against a fresh measurement, never to make a stall
# go away.
[limits]
cpu_ms = 300

# Static client served from the same origin as the /ws WebSocket.
# Remove this block for the "Pages + separate Worker" split (then set WS_BASE in the client).
[assets]
directory = "./app"
binding = "ASSETS"

# One Durable Object instance per room (addressed by room code).
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

# SQLite-backed DO class — room state is persisted in DO storage, so matches
# survive hibernation, evictions and deploys.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# Optional player stats (D1). Everything works without this: with no DB binding
# the Worker skips the writes and /stats answers {"available":false}.
#   npx wrangler d1 create trump-stats
#   npx wrangler d1 execute trump-stats --remote --file=./schema.sql
# then uncomment and paste in the printed database_id:
# [[d1_databases]]
# binding = "DB"
# database_name = "trump-stats"
# database_id = "<paste-from-wrangler-d1-create>"
