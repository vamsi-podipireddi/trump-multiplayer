<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>TRUMP — Solo</title>
<meta name="description" content="Offline single-player TRUMP: bid for points, call a hidden partner, capture tricks against three AI opponents. No room, no network." />
<meta name="theme-color" content="#0d4d2e" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="stylesheet" href="/css/tokens.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/table.css" />
<link rel="stylesheet" href="/css/panels.css" />
<link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

<!-- Start screen: difficulty + match length, chosen once before startSolo() runs -->
<div id="start-screen" class="screen show">
  <div class="brand">
    <h1>TRUMP</h1>
    <div class="colophon" id="brand-colophon" aria-hidden="true"></div>
    <p class="lede">Bid for points, call a hidden partner, capture tricks. Three AI opponents — no room, no network.</p>
  </div>
  <div class="panel slim">
    <div class="field">
      <label for="sel-difficulty">Opponents</label>
      <select id="sel-difficulty">
        <option value="easy">Easy</option>
        <option value="normal" selected>Normal</option>
        <option value="hard">Hard</option>
      </select>
    </div>
    <div class="field">
      <label for="sel-deals">Match length</label>
      <select id="sel-deals">
        <option value="3">First to 3 deals</option>
        <option value="5" selected>First to 5 deals</option>
        <option value="7">First to 7 deals</option>
      </select>
    </div>
    <button class="btn" id="btn-start" style="width:100%;">Deal me in</button>
  </div>
</div>

<!-- Game -->
<div id="game">
  <header>
    <div>
      <h1>TRUMP<span class="suits" id="title-suits"></span></h1>
      <div class="tagline" id="header-state"></div>
    </div>
    <div class="hdr-actions">
      <button id="btn-colors" data-ic="deck" aria-pressed="false" aria-label="Four-colour deck" title="Colour diamonds blue and clubs green"><span class="wide">4-Colour</span></button>
      <button id="btn-help" data-ic="help" aria-label="How to play"><span class="wide">How to play</span></button>
      <button id="btn-new" data-ic="table" aria-label="New match" title="Abandon this match and choose new settings"><span class="wide">New match</span></button>
    </div>
  </header>
  <div id="table-wrap">
    <div id="table">
      <!-- medallion before #trick: played cards must stack above it -->
      <div id="medallion" data-mode="full" aria-hidden="true">
        <div class="med-label"></div>
        <div class="med-main"></div>
        <div class="med-sub"></div>
        <div class="med-bar"><i></i></div>
        <div class="med-chips"></div>
      </div>
      <div class="seat south" id="seat-south"><div class="nameplate"><span class="avatar"></span><span class="who"></span></div><div class="bidchip"></div><div class="hand-backs" data-backs></div><div class="meta"></div></div>
      <div class="seat west" id="seat-west"><div class="nameplate"><span class="avatar"></span><span class="who"></span></div><div class="bidchip"></div><div class="hand-backs vertical" data-backs></div><div class="meta"></div></div>
      <div class="seat north" id="seat-north"><div class="nameplate"><span class="avatar"></span><span class="who"></span></div><div class="bidchip"></div><div class="hand-backs" data-backs></div><div class="meta"></div></div>
      <div class="seat east" id="seat-east"><div class="nameplate"><span class="avatar"></span><span class="who"></span></div><div class="bidchip"></div><div class="hand-backs vertical" data-backs></div><div class="meta"></div></div>
      <div id="trick"></div>
    </div>
  </div>
  <div id="bottom"><div id="action-bar"></div><div id="my-hand"></div></div>
  <aside data-tab="score">
    <div class="panel-section" id="sec-score"><h2 id="score-title">Scoreboard</h2><table class="score" id="scoreboard"></table><div class="contract-line" id="contract-line"></div></div>
    <div class="panel-section" id="sec-log" style="flex:1; display:flex; flex-direction:column; min-height:0;"><h2>Table log</h2><div id="log" role="log" aria-live="polite" aria-label="Table log"></div></div>
  </aside>
</div>
<nav id="sheet-tabs" aria-label="Table panels">
  <button type="button" data-tab="score" aria-expanded="false">SCORE</button>
  <button type="button" data-tab="log" aria-expanded="false">LOG</button>
</nav>

<div id="overlay"><div class="modal" id="modal"></div></div>

<script type="module" src="/js/solo.js"></script>
</body>
</html>
